# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

title: "SlashBuilder"
author: "SlashBuilder"
email: dlockamy@lockamystudios.com
description: >-
  SlashBuilder is Lockamy Studios' open-source organization. It stewards
  Hearth, BenixOS, and bitchain — the open protocol, the OS built around
  it, and its content-addressed storage kit. SlashBuilder sells nothing;
  it publishes.
baseurl: ""
url: "https://slashbuilder.com"
github_username: slash-builder

# Build settings
# No theme -- fully custom _layouts/default.html + assets/main.css,
# built on Digital Zen tokens with a distinct (non-minima, non-Quickring)
# treatment. See CONTEXT.md.
plugins:
  - jekyll-feed

# CONTEXT.md and README.md are repo-orientation docs for whoever works on
# this repo next, not site content -- exclude them from the build so they
# don't show up as public nav pages.
exclude:
  - CONTEXT.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - Jenkinsfile
